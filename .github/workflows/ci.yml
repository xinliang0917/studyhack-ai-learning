name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "true"
      SQLITE_PATH: test_ci.db
      DEEPSEEK_API_KEY: test-key
      JWT_SECRET: test-secret
      EMBEDDING_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      VECTOR_DIR: ${{ runner.temp }}/vector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install test dependencies
        run: pip install -r backend/requirements-test.txt
      - name: Syntax check
        run: python -m compileall -q backend/app
      - name: Run backend tests
        run: pytest backend/tests -q --ignore=backend/tests/test_system_runner.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: studyhack-ai-learning:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
