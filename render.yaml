services:
  - type: web
    name: studyhack-ai-learning
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: JWT_SECRET
        generateValue: true
      - key: USE_SQLITE
        value: "true"
      - key: SQLITE_PATH
        value: ai_learning.db
      - key: SEED_DEMO
        value: "true"
      - key: EMBEDDING_ENABLED
        value: "false"
      - key: OCR_ENABLED
        value: "true"
      - key: FACE_MATCH_THRESHOLD
        value: "90"
      - key: RETRIEVAL_MODE
        value: bm25
      - key: CORS_ORIGINS
        value: "*"
